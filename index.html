<style>
/* Layout: CAD workspace. A CommandManager ribbon of sketch tools sits over a
   PropertyManager rail and a drafting sheet; status bar reports definition. */
:root {
  --chrome: #e7eaed;
  --panel: #f4f6f8;
  --sheet: #fbfcfd;
  --field: #ffffff;
  --ink: #161a1f;
  --ink-soft: #5b6570;
  --rule: #cfd5db;
  --hover-bg: rgba(22, 26, 31, 0.06);
  --active-bg: #dbf1f5;
  --grid-minor: rgba(28, 52, 84, 0.055);
  --grid-major: rgba(28, 52, 84, 0.12);
  --axis: rgba(28, 52, 84, 0.26);
  --under: #1450d2;
  --over: #cf2e25;
  --driven: #7d8792;
  --hover: #e2730a;
  --select: #0a98ae;
  --select-ink: #066877;
  --rel-bg: #e1f2e4;
  --rel-line: #86c294;
  --rel-ink: #1d6a33;
  --infer-bg: #ffe6a0;
  --infer-ink: #6b4e00;
  --guide: rgba(20, 80, 210, 0.55);
  --trim: rgba(207, 46, 37, 0.5);
  --box-win: rgba(10, 152, 174, 0.10);
  --box-cross: rgba(46, 160, 67, 0.10);
  --under-tint: #e1e9fa;
  --over-tint: #fae3e1;
  --full-tint: #e2e6ea;
  --shadow: rgba(16, 24, 32, 0.16);
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-num: "B612 Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #111519; --panel: #171c21; --sheet: #0d1114; --field: #0f1317;
    --ink: #e4e9ee; --ink-soft: #95a0ab; --rule: #29313a;
    --hover-bg: rgba(228, 233, 238, 0.07); --active-bg: #0e3940;
    --grid-minor: rgba(160, 190, 220, 0.055); --grid-major: rgba(160, 190, 220, 0.12); --axis: rgba(160, 190, 220, 0.3);
    --under: #7aa7ff; --over: #ff6d60; --driven: #8a95a0; --hover: #ffa94a; --select: #3cd0e4; --select-ink: #8be6f2;
    --rel-bg: #15301e; --rel-line: #3f8b57; --rel-ink: #93e2aa; --infer-bg: #4a3a0a; --infer-ink: #ffd76e;
    --guide: rgba(122, 167, 255, 0.6); --trim: rgba(255, 109, 96, 0.55);
    --box-win: rgba(60, 208, 228, 0.12); --box-cross: rgba(80, 200, 110, 0.12);
    --under-tint: #142343; --over-tint: #3b1714; --full-tint: #20262c; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #111519; --panel: #171c21; --sheet: #0d1114; --field: #0f1317;
  --ink: #e4e9ee; --ink-soft: #95a0ab; --rule: #29313a;
  --hover-bg: rgba(228, 233, 238, 0.07); --active-bg: #0e3940;
  --grid-minor: rgba(160, 190, 220, 0.055); --grid-major: rgba(160, 190, 220, 0.12); --axis: rgba(160, 190, 220, 0.3);
  --under: #7aa7ff; --over: #ff6d60; --driven: #8a95a0; --hover: #ffa94a; --select: #3cd0e4; --select-ink: #8be6f2;
  --rel-bg: #15301e; --rel-line: #3f8b57; --rel-ink: #93e2aa; --infer-bg: #4a3a0a; --infer-ink: #ffd76e;
  --guide: rgba(122, 167, 255, 0.6); --trim: rgba(255, 109, 96, 0.55);
  --box-win: rgba(60, 208, 228, 0.12); --box-cross: rgba(80, 200, 110, 0.12);
  --under-tint: #142343; --over-tint: #3b1714; --full-tint: #20262c; --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--chrome); color: var(--ink);
  font: 14px/1.35 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 18px; height: 18px; }

.app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
.app > * { flex: none; min-width: 0; }
.app > .main { flex: 1 1 auto; }
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: 0.01em; white-space: nowrap; padding: 2px 6px 2px 2px; margin-left: -2px; border: 0; border-radius: 7px; background: transparent; }
.brand:hover { background: var(--hover-bg); }
.brand svg { width: 26px; height: 26px; }
.doc { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.doc-name {
  min-width: 0; width: 100%; max-width: 340px; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; font-weight: 500; font-size: 15px; text-overflow: ellipsis;
}
.doc-name:hover { border-color: var(--rule); }
.doc-name:focus { border-color: var(--select); background: var(--field); outline: none; }
.save-state { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
.save-state.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--hover); margin-right: 6px; vertical-align: 1px; }
.actions { display: flex; align-items: center; gap: 2px; }
.ab {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 6px; background: transparent; font-weight: 500; white-space: nowrap;
}
.ab:hover { background: var(--hover-bg); }
.ab:disabled { opacity: 0.4; cursor: default; background: transparent; }
.ab.icon-only { padding: 0 7px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 230px; padding: 4px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 28px var(--shadow);
}
.menu button { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 14px; padding: 7px 10px; border: 0; border-radius: 5px; background: transparent; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--hover-bg); }
.menu .ext { font: 11.5px var(--font-num); color: var(--ink-soft); }

/* ---------- document tabs ---------- */
.doctabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding-top: 2px; }
.doctabs::-webkit-scrollbar { display: none; }
.dtab {
  display: flex; align-items: center; gap: 4px; height: 30px; max-width: 220px; min-width: 0; padding: 0 4px 0 11px; flex: none;
  border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; background: transparent; color: var(--ink-soft); cursor: pointer; user-select: none;
}
.dtab:hover { background: var(--hover-bg); color: var(--ink); }
.dtab[aria-selected="true"] { background: var(--panel); border-color: var(--rule); color: var(--ink); box-shadow: inset 0 2px 0 var(--select); }
.dtab .dt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 13.5px; }
.dtab .dt-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hover); flex: none; }
.dtab .dt-x { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--ink-soft); flex: none; }
.dtab .dt-x:hover { background: var(--hover-bg); color: var(--over); }
.dtab .dt-x svg { width: 14px; height: 14px; }
.dtab-new { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; margin-bottom: 1px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); flex: none; }
.dtab-new:hover { background: var(--hover-bg); color: var(--ink); }

/* ---------- viewer and embed modes ---------- */
.viewbar { display: flex; align-items: center; gap: 10px; padding-block: 6px; border-top: 1px solid var(--rule); background: var(--panel); min-width: 0; }
.viewbar[hidden] { display: none; }
.viewbar .vb-name { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewbar .vb-note { font-size: 12.5px; color: var(--ink-soft); padding: 1px 8px; border: 1px solid var(--rule); border-radius: 999px; white-space: nowrap; }
.viewbar .grow { flex: 1; }
body.viewer .ribbon, body.viewer .doctabs, body.viewer .pm, body.viewer .side, body.viewer .actions, body.viewer .doc,
body.viewer #btnSnap, body.viewer #btnSide, body.viewer #storeInfo { display: none !important; }
body.viewer .main, body.viewer .main.with-side { grid-template-columns: minmax(0, 1fr); }
body.viewer .stage canvas { cursor: grab; }
body.embed .topbar, body.embed .viewbar, body.embed .statusbar { display: none !important; }
body.embed .main { padding: 0; }
body.embed .stage { border: 0; border-radius: 0; }
body.embed .view-hud { top: 6px; right: 6px; }
.embed-open {
  position: fixed; right: 8px; bottom: 8px; z-index: 40; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); color: var(--ink); font-size: 12.5px; font-weight: 600; text-decoration: none; box-shadow: 0 4px 14px var(--shadow);
}
.embed-open:hover { border-color: var(--select); }
.embed-open svg { width: 20px; height: 20px; }
.credit { border: 0; background: transparent; padding: 0 2px; font: inherit; color: var(--ink-soft); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.credit:hover { color: var(--ink); text-decoration-color: currentColor; }

/* ---------- share, about and export dialogs ---------- */
.share-out { display: grid; gap: 6px; margin-top: 12px; }
.share-out textarea { width: 100%; min-height: 76px; font: 12px/1.4 var(--font-num); resize: vertical; word-break: break-all; }
.share-meta { font-size: 12.5px; color: var(--ink-soft); }
.share-meta.warn { color: var(--over); }
.dlg-sec + .dlg-sec { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
.dlg-sec h3 { margin: 0 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.about-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.about-head svg { width: 46px; height: 46px; flex: none; }
.about-head h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
.about-head p { margin: 2px 0 0; color: var(--ink-soft); }
.link-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; padding: 0; list-style: none; }
.link-list a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--rule); border-radius: 6px; background: var(--field); color: var(--ink); text-decoration: none; font-weight: 500; }
.link-list a:hover { border-color: var(--select); }
.dlg-body a.inline { color: var(--select-ink); }
.keys-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.keys-table td { padding: 4px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.keys-table td:first-child { white-space: nowrap; width: 1%; }
.keys-table kbd { font: 11.5px var(--font-num); padding: 0 4px; border: 1px solid var(--rule); border-radius: 3px; background: var(--field); }
.opt-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.opt-grid > label { font-size: 13.5px; color: var(--ink-soft); }
.tb-fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 8px; align-items: center; }
.tb-fields label { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
.drop-hint { position: absolute; inset: 10px; z-index: 30; display: grid; place-items: center; border: 2px dashed var(--select); border-radius: 10px; background: var(--box-win); color: var(--select-ink); font-weight: 600; font-size: 16px; pointer-events: none; }
input[type="range"] { width: 100%; accent-color: var(--select); }

/* ---------- ribbon (CommandManager) ---------- */
.ribbon { display: flex; flex-direction: column; min-width: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--panel); }
.ribbon-scroll { min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.ribbon-tabs { display: flex; gap: 2px; padding: 0 0 4px; }
.rtab { height: 22px; padding: 0 14px; border: 0; border-radius: 0 0 6px 6px; background: transparent; font-weight: 600; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft); }
.rtab:hover { color: var(--ink); background: var(--hover-bg); }
.rtab[aria-selected="true"] { color: var(--select-ink); background: var(--active-bg); box-shadow: inset 0 2px 0 var(--select); }
.ribbon-in { display: flex; align-items: stretch; gap: 0; min-width: max-content; padding-block: 4px 2px; }
.grp { display: flex; flex-direction: column; padding: 0 6px; }
.grp + .grp { border-left: 1px solid var(--rule); }
.grp-btns { display: flex; gap: 1px; }
.grp-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); text-align: center; padding: 1px 0 2px; }
.tb {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 54px; height: 50px; padding: 0 4px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; font-weight: 500; font-size: 12px; line-height: 1.05; white-space: nowrap;
}
.tb:hover { background: var(--hover-bg); }
.tb[aria-pressed="true"] { background: var(--active-bg); border-color: var(--select); color: var(--select-ink); }
.tb:disabled { opacity: 0.38; cursor: default; background: transparent; }
.only-narrow { display: none; }

/* ---------- main: PropertyManager + sheet ---------- */
.main { position: relative; display: grid; grid-template-columns: 284px minmax(0, 1fr); gap: 10px; padding-block: 10px; min-height: 0; }
.pm { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.pm-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--rule); min-height: 44px; }
.pm-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pm-close { display: none; }
.pm-body { flex: 1; overflow-y: auto; padding: 4px 0 14px; overscroll-behavior: contain; }
.sec { padding: 10px 12px 6px; }
.sec + .sec { border-top: 1px solid var(--rule); }
.sec h3 { margin: 0 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.hint { margin: 0; color: var(--ink-soft); font-size: 13.5px; line-height: 1.4; text-wrap: pretty; }
.hint kbd, .tips kbd { font: 11.5px var(--font-num); padding: 0 4px; border: 1px solid var(--rule); border-radius: 3px; background: var(--field); color: var(--ink); }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 13.5px; color: var(--ink-soft); }
.tips b { color: var(--ink); font-weight: 600; }
.status-block { display: grid; gap: 3px; }
.status-big { font-size: 20px; font-weight: 600; line-height: 1.1; }
.status-big.under { color: var(--under); } .status-big.full { color: var(--ink); } .status-big.over { color: var(--over); }
.status-sub { font: 12.5px var(--font-num); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 4px; margin-top: 10px; font-size: 13px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 0; border-top: 2px solid; }

.seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--field); }
.seg button { flex: 1; padding: 6px 4px; border: 0; background: transparent; font-weight: 500; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--active-bg); color: var(--select-ink); }
.chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--select); margin: 0; }
.fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
.fields label { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.num {
  width: 100%; min-width: 0; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 5px; background: var(--field);
  font: 13px var(--font-num); font-variant-numeric: tabular-nums;
}
.num:focus { border-color: var(--select); outline: none; }
.num:disabled { opacity: 0.6; background: transparent; }
.num.bad { border-color: var(--over); }
.unit { font: 11.5px var(--font-num); color: var(--ink-soft); }
.rel-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.rel-row { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 2px; border-radius: 5px; font-size: 13.5px; }
.rel-row:hover { background: var(--hover-bg); }
.rel-row .rn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-row .rn small { color: var(--ink-soft); font-size: 12.5px; }
.rel-row.bad .rn { color: var(--over); }
.rel-row .x { border: 0; background: transparent; padding: 2px; border-radius: 4px; color: var(--ink-soft); display: inline-flex; }
.rel-row .x:hover { color: var(--over); background: var(--hover-bg); }
.glyph-ico { width: 20px; height: 20px; flex: none; border-radius: 4px; background: var(--rel-bg); border: 1px solid var(--rel-line); color: var(--rel-ink); display: inline-flex; align-items: center; justify-content: center; }
.glyph-ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rel-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.rel-btn { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 6px; background: var(--field); font-weight: 500; font-size: 13.5px; text-align: left; }
.rel-btn:hover { border-color: var(--select); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--field); font-weight: 500; }
.btn:hover { border-color: var(--select); }
.btn.primary { background: var(--select); border-color: var(--select); color: var(--sheet); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger:hover { border-color: var(--over); color: var(--over); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
.picklist { display: grid; gap: 3px; min-height: 34px; padding: 5px; border: 1px solid var(--rule); border-radius: 6px; background: var(--field); font-size: 13px; cursor: pointer; }
.picklist.focus { border-color: var(--select); box-shadow: 0 0 0 2px var(--box-win); }
.picklist .empty { color: var(--ink-soft); }
.picklist .pk { display: flex; justify-content: space-between; gap: 6px; }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }

<script>
/* =====================================================================
   Croquis — core
   Geometry model, SolidWorks-style relations and dimensions written as
   equations, a Newton solver with weighted minimum-norm steps, DOF and
   redundancy analysis, and sketch operations (fillet, trim, mirror).
   No DOM access in this file.
   ===================================================================== */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.SketchCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const TAU = Math.PI * 2;
  const DEG = Math.PI / 180;
  const hyp = (x, y) => Math.sqrt(x * x + y * y);
  const sgn = (x) => (x < 0 ? -1 : 1);
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  function wrapPi(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
  function normAng(a) { a %= TAU; if (a < 0) a += TAU; return a; }

  const LABEL = { point: 'Point', line: 'Line', circle: 'Circle', arc: 'Arc' };

  const REL_INFO = {
    coincident: { name: 'Merge', glyph: 'coincident' },
    pointOnLine: { name: 'Coincident', glyph: 'onCurve' },
    pointOnCircle: { name: 'Coincident', glyph: 'onCurve' },
    midpoint: { name: 'Midpoint', glyph: 'midpoint' },
    horizontal: { name: 'Horizontal', glyph: 'horizontal' },
    vertical: { name: 'Vertical', glyph: 'vertical' },
    parallel: { name: 'Parallel', glyph: 'parallel' },
    perpendicular: { name: 'Perpendicular', glyph: 'perpendicular' },
    collinear: { name: 'Collinear', glyph: 'collinear' },
    equal: { name: 'Equal', glyph: 'equal' },
    tangent: { name: 'Tangent', glyph: 'tangent' },
    concentric: { name: 'Concentric', glyph: 'concentric' },
    coradial: { name: 'Coradial', glyph: 'coradial' },
    fix: { name: 'Fix', glyph: 'fix' },
    symmetric: { name: 'Symmetric', glyph: 'symmetric' },
    intersection: { name: 'Intersection', glyph: 'intersection' },
    polygon: { name: 'Polygon', glyph: 'polygon' },
    equalSweep: { name: 'Mirrored sweep', glyph: null },
    offsetEqual: { name: 'Equal offset', glyph: 'offset' },
  };
  const DIM_INFO = {
    distance: 'Distance', hdistance: 'Horizontal distance', vdistance: 'Vertical distance',
    pointLineDistance: 'Distance', lineLineDistance: 'Distance',
    diameter: 'Diameter', radius: 'Radius', angle: 'Angle',
    offset: 'Offset',
  };
  const isDimType = (t) => Object.prototype.hasOwnProperty.call(DIM_INFO, t);
  const lc = (s) => String(s).toLowerCase();
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const numStr = (v) => String(+(+v).toPrecision(12));

  /* Notes: annotation objects drawn on layers above the sketch. Their
     anchors ("a", "b") follow sketch geometry: a point, the midpoint of a
     line, a position along a curve, or a free position. */
  const NOTE_TYPES = ['text', 'force', 'moment', 'load', 'support', 'spring', 'damper', 'frame', 'mass'];
  const NOTE_PREFIX = { force: 'F', moment: 'M', load: 'q', spring: 'k', damper: 'c', mass: 'm', frame: 'B' };
  const NOTE_DEFAULTS = {
    text: { text: '', leader: true, size: 14, frame: false, off: { x: 0, y: 0 } },
    force: { dir: { ang: 0, ref: 0 }, len: 20, head: false, text: '', lab: null },
    moment: { r: 8, ang: 90, sweep: 270, ccw: true, text: '', lab: null },
    load: { q0: 8, q1: 8, side: 1, text: '', lab: null },
    support: { kind: 'pin', ang: 90, size: 22 },
    spring: { coils: 6, width: 12, text: '', lab: null },
    damper: { width: 14, text: '', lab: null },
    frame: { dir: { ang: 0, ref: 0 }, len: 14, lx: 'x', ly: 'y', text: '', lab: null },
    mass: { size: 16, text: '', lab: null },
  };
  const NOTE_ANCHORS = { text: ['a'], force: ['a'], moment: ['a'], load: ['a', 'b'], support: ['a'], spring: ['a', 'b'], damper: ['a', 'b'], frame: ['a'], mass: ['a'] };
  const defaultCounters = () => ({ point: 0, line: 0, circle: 0, arc: 0, dim: 0, group: 0, layer: 0, link: 0, var: 0, F: 0, M: 0, q: 0, k: 0, c: 0, m: 0, B: 0 });

  /* ------------------------------------------------------------------
     Model
     ------------------------------------------------------------------ */
  class Sketch {
    constructor(empty) {
      this.X = [];
      this.ents = new Map();
      this.cons = new Map();
      this.groups = new Map();
      this.layers = new Map();
      this.notes = new Map();
      this.vars = new Map();
      this.activeLayer = 0;
      this.sheet = null;
      this.pictures = new Map();
      this.nextId = 1;
      this.counters = defaultCounters();
      this.originId = 0;
      if (!empty) this.originId = this.addPoint(0, 0, { origin: true, name: 'Origin' });
    }
    _id() { return this.nextId++; }
    _param(v) { this.X.push(Number.isFinite(+v) ? +v : 0); return this.X.length - 1; }
    _name(type) { this.counters[type] = (this.counters[type] || 0) + 1; return LABEL[type] + this.counters[type]; }
    _ownedPoint(x, y, owner, role) {
      const id = this._id();
      this.ents.set(id, { id, type: 'point', x: this._param(x), y: this._param(y), owner, role, construction: false, origin: false, name: '' });
      return id;
    }
    addPoint(x, y, o = {}) {
      const id = this._id();
      this.ents.set(id, { id, type: 'point', x: this._param(x), y: this._param(y), owner: 0, role: '', origin: !!o.origin, construction: !!o.construction, name: o.name || this._name('point') });
      return id;
    }
    addLine(x1, y1, x2, y2, o = {}) {
      const id = this._id();
      const e = { id, type: 'line', p1: 0, p2: 0, construction: !!o.construction, name: this._name('line') };
      this.ents.set(id, e);
      e.p1 = this._ownedPoint(x1, y1, id, 'p1');
      e.p2 = this._ownedPoint(x2, y2, id, 'p2');
      return id;
    }
    addCircle(cx, cy, r, o = {}) {
      const id = this._id();
      const e = { id, type: 'circle', c: 0, r: this._param(r), construction: !!o.construction, name: this._name('circle') };
      this.ents.set(id, e);
      e.c = this._ownedPoint(cx, cy, id, 'c');
      return id;
    }
    /* Arc runs counter-clockwise from p1 to p2 around c. */
    addArc(cx, cy, x1, y1, x2, y2, o = {}) {
      const id = this._id();
      const e = { id, type: 'arc', c: 0, p1: 0, p2: 0, construction: !!o.construction, name: this._name('arc') };
      this.ents.set(id, e);
      e.c = this._ownedPoint(cx, cy, id, 'c');
      e.p1 = this._ownedPoint(x1, y1, id, 'p1');
      e.p2 = this._ownedPoint(x2, y2, id, 'p2');
      return id;
    }
    get(id) { return this.ents.get(id); }
    P(id) { const e = this.ents.get(id); return { x: this.X[e.x], y: this.X[e.y] }; }
    setP(id, x, y) { const e = this.ents.get(id); this.X[e.x] = x; this.X[e.y] = y; }
    R(e) {
      if (typeof e === 'number') e = this.ents.get(e);
      if (e.type === 'circle') return this.X[e.r];
      const c = this.P(e.c), p = this.P(e.p1);
      return hyp(p.x - c.x, p.y - c.y);
    }
    arcGeom(e) {
      const c = this.P(e.c), a = this.P(e.p1), b = this.P(e.p2);
      const r = hyp(a.x - c.x, a.y - c.y);
      const a1 = Math.atan2(a.y - c.y, a.x - c.x);
      let sweep = normAng(Math.atan2(b.y - c.y, b.x - c.x) - a1);
      if (sweep < 1e-9) sweep = TAU;
      return { c, r, a1, a2: a1 + sweep, sweep };
    }
    ownedPoints(id) {
      const e = this.ents.get(id);
      if (!e) return [];
      if (e.type === 'line') return [e.p1, e.p2];
      if (e.type === 'circle') return [e.c];
      if (e.type === 'arc') return [e.c, e.p1, e.p2];
      return [];
    }
    paramsOf(id) {
      const e = this.ents.get(id);
      if (!e) return [];
      switch (e.type) {
        case 'point': return [e.x, e.y];
        case 'line': return [...this.paramsOf(e.p1), ...this.paramsOf(e.p2)];
        case 'circle': return [...this.paramsOf(e.c), e.r];
        case 'arc': return [...this.paramsOf(e.c), ...this.paramsOf(e.p1), ...this.paramsOf(e.p2)];
      }
      return [];
    }
    nameOf(id) {
      const e = this.ents.get(id);
      if (!e) return '?';
      if (e.type === 'point' && e.owner) {
        const o = this.ents.get(e.owner);
        const role = { p1: 'start', p2: 'end', c: 'center' }[e.role] || '';
        return (o ? o.name : '?') + ' ' + role;
      }
      return e.name;
    }
    addCon(type, refs, o = {}) {
      const id = this._id();
      const c = { id, type, refs: refs.slice(), data: o.data || {}, implicit: !!o.implicit };
      if (isDimType(type)) { c.dim = true; c.value = o.value; c.driven = !!o.driven; c.label = o.label || null; }
      this.cons.set(id, c);
      return id;
    }
    consOf(id) { const out = []; for (const c of this.cons.values()) if (c.refs.includes(id)) out.push(c); return out; }
    /* Removes an entity, its owned points, and every constraint that touches
       them. Notes attached to it stay where they are, unattached. */
    removeEnt(id) {
      const e = this.ents.get(id);
      if (!e || e.origin) return;
      if (e.type === 'point' && e.owner) return this.removeEnt(e.owner);
      const kill = new Set([id, ...this.ownedPoints(id)]);
      this._freeNoteRefs(kill);
      for (const c of [...this.cons.values()]) if (c.refs.some((r) => kill.has(r))) this.removeCon(c.id);
      for (const k of kill) this.ents.delete(k);
    }
    /* Removes a constraint. Equations that used a deleted dimension keep
       their current values instead of breaking. */
    removeCon(id) {
      const c = this.cons.get(id);
      if (!c) return;
      if (c.dim && c.name) {
        const ev = evaluateEquations(this);
        this.cons.delete(id);
        bakeName(this, c.name, ev);
      } else this.cons.delete(id);
    }
    topOf(id) { const e = this.ents.get(id); return e && e.type === 'point' && e.owner ? e.owner : id; }

    /* ---- visibility ---- */
    entVisible(id) {
      const e = this.ents.get(id);
      if (!e) return false;
      if (e.type === 'point' && e.owner) return this.entVisible(e.owner);
      if (e.hidden) return false;
      if (e.group) { const g = this.groups.get(e.group); if (g && g.hidden) return false; }
      return true;
    }
    conVisible(c) {
      if (c.dim) {
        if (c.hidden) return false;
        if (c.group) { const g = this.groups.get(c.group); if (g && g.hidden) return false; }
      }
      for (const r of c.refs) if (!this.entVisible(r)) return false;
      return true;
    }

    /* ---- names shared by dimensions and global variables ---- */
    nameTaken(name, except) {
      const k = lc(name);
      const v = this.vars.get(k);
      if (v && v !== except) return true;
      for (const c of this.cons.values()) if (c.dim && c.name && lc(c.name) === k && c !== except) return true;
      return false;
    }
    nextDimName() {
      let k = this.counters.dim || 0, name;
      do { k++; name = 'D' + k; } while (this.nameTaken(name));
      this.counters.dim = k;
      return name;
    }
    dimByName(name) {
      const k = lc(name);
      for (const c of this.cons.values()) if (c.dim && c.name && lc(c.name) === k) return c;
      return null;
    }

    /* ---- groups and note layers ---- */
    addGroup(name, color) {
      const id = this._id();
      if (!name) { this.counters.group = (this.counters.group || 0) + 1; name = 'Group ' + this.counters.group; }
      this.groups.set(id, { id, name: String(name), color: color || null, hidden: false });
      return id;
    }
    addLayer(name, color) {
      const id = this._id();
      if (!name) { this.counters.layer = (this.counters.layer || 0) + 1; name = 'Layer ' + this.counters.layer; }
      this.layers.set(id, { id, name: String(name), color: color || 'magenta', hidden: false, locked: false });
      if (!this.layers.has(this.activeLayer)) this.activeLayer = id;
      return id;
    }
    ensureLayer() {
      if (this.layers.has(this.activeLayer)) return this.activeLayer;
      const first = this.layers.keys().next();
      if (!first.done) { this.activeLayer = first.value; return first.value; }
      return this.addLayer('Notes', 'magenta');
    }

    /* ---- notes ---- */
    addNote(type, props) {
      if (!own(NOTE_DEFAULTS, type)) throw new Error('Unknown note type ' + type);
      const id = this._id();
      const n = Object.assign({ id, type, layer: this.ensureLayer(), color: null, w: null }, JSON.parse(JSON.stringify(NOTE_DEFAULTS[type])), props || {});
      n.id = id; n.type = type;
      this.notes.set(id, n);
      return id;
    }
    nextNoteLabel(type) {
      const p = NOTE_PREFIX[type];
      if (!p) return '';
      this.counters[p] = (this.counters[p] || 0) + 1;
      return type === 'frame' ? '{' + this.counters[p] + '}' : p + '_' + this.counters[p];
    }
    anchorPos(a) {
      if (!a) return null;
      if (a.k === 'free') return { x: +a.x || 0, y: +a.y || 0 };
      const e = this.ents.get(a.id);
      if (!e) return null;
      if (a.k === 'pt') return e.type === 'point' ? this.P(a.id) : null;
      if (a.k === 'mid') {
        if (e.type !== 'line') return null;
        const p = this.P(e.p1), q = this.P(e.p2);
        return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
      }
      if (a.k === 'on') {
        const t = +a.t || 0;
        if (e.type === 'line') { const p = this.P(e.p1), q = this.P(e.p2); return { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t }; }
        if (e.type === 'circle') { const c = this.P(e.c), r = this.X[e.r]; return { x: c.x + r * Math.cos(t), y: c.y + r * Math.sin(t) }; }
        if (e.type === 'arc') { const g = this.arcGeom(e), th = g.a1 + g.sweep * t; return { x: g.c.x + g.r * Math.cos(th), y: g.c.y + g.r * Math.sin(th) }; }
      }
      return null;
    }
    /* The line an anchor sits on, if any (for direction inference). */
    anchorLine(a) {
      if (!a || a.k === 'free') return 0;
      const e = this.ents.get(a.id);
      if (!e) return 0;
      if (e.type === 'line') return e.id;
      if (e.type === 'point' && e.owner) { const o = this.ents.get(e.owner); if (o && o.type === 'line') return o.id; }
      return 0;
    }
    lineAngle(id) {
      const e = this.ents.get(id);
      if (!e || e.type !== 'line') return 0;
      const p = this.P(e.p1), q = this.P(e.p2);
      return Math.atan2(q.y - p.y, q.x - p.x) / DEG;
    }
    /* World direction of a note in degrees: absolute, or relative to a line. */
    dirAngle(dir) {
      if (!dir) return 0;
      return (+dir.ang || 0) + (dir.ref && this.ents.has(dir.ref) ? this.lineAngle(dir.ref) : 0);
    }
    noteAnchors(n) { return NOTE_ANCHORS[n.type] || []; }
    /* Detaches notes from entities: anchors become free positions and,
       unless keepDirs, directions measured from a line become absolute. */
    _freeNoteRefs(kill, keepDirs) {
      for (const n of this.notes.values()) {
        for (const key of this.noteAnchors(n)) {
          const a = n[key];
          if (!a || a.k === 'free' || !kill.has(a.id)) continue;
          const p = this.anchorPos(a) || { x: 0, y: 0 };
          n[key] = { k: 'free', x: p.x, y: p.y };
        }
        if (!keepDirs && n.dir && n.dir.ref && kill.has(n.dir.ref)) n.dir = { ang: this.dirAngle(n.dir), ref: 0 };
      }
    }
    bbox(includeConstruction = true) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const add = (x, y) => { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; };
      for (const e of this.ents.values()) {
        if (!includeConstruction && e.construction) continue;
        if (e.type === 'point') { if (e.origin && this.ents.size > 1) continue; const p = this.P(e.id); add(p.x, p.y); }
        else if (e.type === 'circle') { const c = this.P(e.c), r = this.X[e.r]; add(c.x - r, c.y - r); add(c.x + r, c.y + r); }
        else if (e.type === 'arc') {
          const g = this.arcGeom(e);
          add(g.c.x + g.r * Math.cos(g.a1), g.c.y + g.r * Math.sin(g.a1));
          add(g.c.x + g.r * Math.cos(g.a2), g.c.y + g.r * Math.sin(g.a2));
          for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; if (normAng(a - g.a1) <= g.sweep) add(g.c.x + g.r * Math.cos(a), g.c.y + g.r * Math.sin(a)); }
        }
      }
      if (!Number.isFinite(x0)) return null;
      return { x0, y0, x1, y1 };
    }
    toJSON() {
      const ptJ = (id) => { const e = this.ents.get(id); return { id, x: this.X[e.x], y: this.X[e.y] }; };
      const entities = [];
      for (const e of this.ents.values()) {
        if (e.type === 'point' && e.owner) continue;
        const o = { id: e.id, type: e.type, name: e.name };
        if (e.construction) o.construction = true;
        if (e.type === 'point') { o.x = this.X[e.x]; o.y = this.X[e.y]; if (e.origin) o.origin = true; }
        else if (e.type === 'line') { o.p1 = ptJ(e.p1); o.p2 = ptJ(e.p2); }
        else if (e.type === 'circle') { o.c = ptJ(e.c); o.r = this.X[e.r]; }
        else if (e.type === 'arc') { o.c = ptJ(e.c); o.p1 = ptJ(e.p1); o.p2 = ptJ(e.p2); }
        if (e.style && Object.keys(e.style).length) o.style = Object.assign({}, e.style);
        if (e.group) o.group = e.group;
        if (e.hidden) o.hidden = true;
        entities.push(o);
      }
      const constraints = [];
      for (const c of this.cons.values()) {
        const o = { id: c.id, type: c.type, refs: c.refs.slice() };
        if (c.data && Object.keys(c.data).length) o.data = Object.assign({}, c.data);
        if (c.implicit) o.implicit = true;
        if (c.dim) {
          o.value = c.value;
          if (c.driven) o.driven = true;
          if (c.label) o.label = Object.assign({}, c.label);
          if (c.name) o.name = c.name;
          if (c.expr) o.expr = c.expr;
          if (c.hidden) o.hidden = true;

            q.f = (v) => {
              const ux = v[P[0]] - v[C[0]], uy = v[P[1]] - v[C[1]], dx = v[L[2]] - v[L[0]], dy = v[L[3]] - v[L[1]];
              return (ux * dx + uy * dy) / ((hyp(ux, uy) * hyp(dx, dy)) || 1e-12);
            };
          } else {
            const r = slotRad(q, sk, cv); const s = d.s || 1;
            q.f = (v) => sdistV(v, v[C[0]], v[C[1]], L) - s * r(v);
          }
        } else {
          const contact = topo ? curveCurveContact(topo, a, b) : null;
          const q = mk(); const C1 = slotPt(q, E(a.c)), C2 = slotPt(q, E(b.c));
          if (contact) {
            const Pa = slotPt(q, E(contact[0])), Pb = slotPt(q, E(contact[1]));
            const s = d.mode === 'int' ? 1 : -1;
            q.f = (v) => {
              const ux = v[Pa[0]] - v[C1[0]], uy = v[Pa[1]] - v[C1[1]], wx = v[Pb[0]] - v[C2[0]], wy = v[Pb[1]] - v[C2[1]];
              return Math.atan2(s * (ux * wy - uy * wx), s * (ux * wx + uy * wy));
            };
          } else {
            const r1 = slotRad(q, sk, a), r2 = slotRad(q, sk, b);
            if (d.mode === 'int') { const s = d.s || 1; q.f = (v) => hyp(v[C2[0]] - v[C1[0]], v[C2[1]] - v[C1[1]]) - s * (r1(v) - r2(v)); }
            else q.f = (v) => hyp(v[C2[0]] - v[C1[0]], v[C2[1]] - v[C1[1]]) - (r1(v) + r2(v));

      }

          }

            const q = mk(); const A = slotPt(q, v0), B = slotPt(q, E(lines[k].p1)), C = slotPt(q, Cc);
            q.f = (v) => hyp(v[A[0]] - v[C[0]], v[A[1]] - v[C[1]]) - hyp(v[B[0]] - v[C[0]], v[B[1]] - v[C[1]]);

        } else {
          for (const l of lines) {
            const q = mk(); const P = slotPt(q, E(l.p1)), C = slotPt(q, Cc), r = slotRad(q, sk, circ);

        const [a, b, ax] = R;

        else if (a.type === 'line') {

          else { symPts(E(a.p1), E(b.p1), ax); symPts(E(a.p2), E(b.p2), ax); }
        } else { symPts(E(a.c), E(b.c), ax); eqRad(a, b); }
        break;
      }
      case 'intersection': onLine(R[0], R[1]); onLine(R[0], R[2]); break;
      case 'offsetEqual': {
        const q = mk(); const a = slotOff(q, sk, R[0], R[1]), b = slotOff(q, sk, R[2], R[3]);
        if (!a || !b) { out.pop(); break; }
        const sa = d.sA || 1, sb = d.sB || 1;
        q.f = (v) => sb * b(v) - sa * a(v);

      }
      case 'offset': {
        const q = mk(); const o = slotOff(q, sk, R[0], R[1]);
        if (!o) { out.pop(); break; }

        q.f = (v) => s * o(v) - c.value;
        break;
      }
      case 'equalSweep': {
        const q = mk();
        const sw = (arc) => {
          const C = slotPt(q, E(arc.c)), A = slotPt(q, E(arc.p1)), B = slotPt(q, E(arc.p2));
          return (v) => { const ux = v[A[0]] - v[C[0]], uy = v[A[1]] - v[C[1]], wx = v[B[0]] - v[C[0]], wy = v[B[1]] - v[C[1]]; return Math.atan2(ux * wy - uy * wx, ux * wx + uy * wy); };
        };
        const sa = sw(R[0]), sb = sw(R[1]);
        q.f = (v) => wrapPi(sa(v) - sb(v));
        break;
      }
      /* ---- dimensions (value read live from the constraint) ---- */
      case 'distance': { const q = mk(); const A = slotPt(q, R[0]), B = slotPt(q, R[1]); q.f = (v) => hyp(v[B[0]] - v[A[0]], v[B[1]] - v[A[1]]) - c.value; break; }
      case 'hdistance': case 'vdistance': {
        const key = c.type === 'hdistance' ? 'x' : 'y';
        const q = mk(); const i = q.s(R[0][key]), j = q.s(R[1][key]); const s = d.s || 1;
        q.f = (v) => s * (v[j] - v[i]) - c.value;
        break;
      }
      case 'pointLineDistance': { const q = mk(); const P = slotPt(q, R[0]), L = slotLine(q, sk, R[1]); const s = d.s || 1; q.f = (v) => sdistV(v, v[P[0]], v[P[1]], L) - s * c.value; break; }
      case 'lineLineDistance': {
        const q = mk(); const L1 = slotLine(q, sk, R[0]), L2 = slotLine(q, sk, R[1]); const s = d.s || 1;
        q.f = (v) => sdistV(v, 0.5 * (v[L2[0]] + v[L2[2]]), 0.5 * (v[L2[1]] + v[L2[3]]), L1) - s * c.value;
        break;
      }
      case 'diameter': { const q = mk(); const r = slotRad(q, sk, R[0]); q.f = (v) => 2 * r(v) - c.value; break; }
      case 'radius': { const q = mk(); const r = slotRad(q, sk, R[0]); q.f = (v) => r(v) - c.value; break; }
      case 'angle': {
        const q = mk(); const A = slotLine(q, sk, R[0]), B = slotLine(q, sk, R[1]);
        const s1 = d.s1 || 1, s2 = d.s2 || 1, sg = d.sigma || 1;
        q.f = (v) => {
          const ux = s1 * (v[A[2]] - v[A[0]]), uy = s1 * (v[A[3]] - v[A[1]]), wx = s2 * (v[B[2]] - v[B[0]]), wy = s2 * (v[B[3]] - v[B[1]]);
          return wrapPi(sg * Math.atan2(ux * wy - uy * wx, ux * wx + uy * wy) - c.value * DEG);

      }

    }
  }

  function buildEquations(sk) {
    const out = [];
    for (const e of sk.ents.values()) {
      if (e.type !== 'arc') continue;
      const q = new Eq(0, e.id);
      const C = slotPt(q, sk.ents.get(e.c)), A = slotPt(q, sk.ents.get(e.p1)), B = slotPt(q, sk.ents.get(e.p2));
      q.f = (v) => hyp(v[A[0]] - v[C[0]], v[A[1]] - v[C[1]]) - hyp(v[B[0]] - v[C[0]], v[B[1]] - v[C[1]]);
      out.push(q);
    }
    const topo = buildTopo(sk);
    for (const c of sk.cons.values()) {
      if (c.dim && c.driven) continue;
      emitConstraint(sk, c, out, topo);
    }
    return out;
  }

  function fixedParams(sk) {
    const s = new Set();
    const o = sk.ents.get(sk.originId);
    if (o) { s.add(o.x); s.add(o.y); }
    for (const c of sk.cons.values()) if (c.type === 'fix') for (const id of c.refs) for (const p of sk.paramsOf(id)) s.add(p);
    return s;
  }
  function liveParams(sk) {
    const s = new Set();
    for (const e of sk.ents.values()) {
      if (e.type === 'point') { s.add(e.x); s.add(e.y); }
      else if (e.type === 'circle') s.add(e.r);
    }
    return s;
  }
  function evalEq(X, q) {
    const v = new Float64Array(q.p.length);
    for (let k = 0; k < q.p.length; k++) v[k] = X[q.p[k]];
    return q.f(v);
  }

  /* Union-find over unknown parameters: equations that share unknowns
     form one cluster; clusters are solved independently. */
  function groupEquations(eqs, fixed, N) {
    const parent = new Int32Array(N);
    for (let i = 0; i < N; i++) parent[i] = i;
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    for (const q of eqs) {
      let first = -1;
      for (const p of q.p) {
        if (fixed.has(p)) continue;
        if (first < 0) first = p; else { const a = find(first), b = find(p); if (a !== b) parent[a] = b; }
      }
    }
    const byRoot = new Map();
    const fixedOnly = [];
    for (const q of eqs) {
      let root = -1;
      for (const p of q.p) if (!fixed.has(p)) { root = find(p); break; }
      if (root < 0) { fixedOnly.push(q); continue; }
      let g = byRoot.get(root);
      if (!g) { g = { eqs: [], cols: new Set() }; byRoot.set(root, g); }
      g.eqs.push(q);
      for (const p of q.p) if (!fixed.has(p)) g.cols.add(p);
    }
    const clusters = [];
    for (const g of byRoot.values()) clusters.push({ eqs: g.eqs, cols: [...g.cols] });
    return { clusters, fixedOnly };
  }

  function cholSolve(M, m, b, x) {
    for (let j = 0; j < m; j++) {
      const rj = j * m;
      let s = M[rj + j];
      for (let k = 0; k < j; k++) s -= M[rj + k] * M[rj + k];
      if (!(s > 1e-300)) return false;
      const dj = Math.sqrt(s);
      M[rj + j] = dj;
      for (let i = j + 1; i < m; i++) {
        const ri = i * m;
        let t = M[ri + j];
        for (let k = 0; k < j; k++) t -= M[ri + k] * M[rj + k];
        M[ri + j] = t / dj;
      }
    }
    for (let i = 0; i < m; i++) { let s = b[i]; const ri = i * m; for (let k = 0; k < i; k++) s -= M[ri + k] * x[k]; x[i] = s / M[ri + i]; }
    for (let i = m - 1; i >= 0; i--) { let s = x[i]; for (let k = i + 1; k < m; k++) s -= M[k * m + i] * x[k]; x[i] = s / M[i * m + i]; }
    return true;
  }

  /* Damped Newton with weighted minimum-norm steps:
     dx = -W J^T (J W J^T + lambda I)^-1 g. Small weights make a
     parameter "stiff", so the solver prefers to move others. */
  function solveCluster(X, eqs, cols, weights, tol, maxIter) {
    const m = eqs.length, n = cols.length;
    const colOf = new Map();
    for (let j = 0; j < n; j++) colOf.set(cols[j], j);
    const w = new Float64Array(n);
    for (let j = 0; j < n; j++) w[j] = weights && weights.has(cols[j]) ? weights.get(cols[j]) : 1;
    const loc = eqs.map((q) => Int32Array.from(q.p, (p) => (colOf.has(p) ? colOf.get(p) : -1)));
    const vb = eqs.map((q) => new Float64Array(q.p.length));
    const g = new Float64Array(m);
    let err2 = 0, errMax = 0;
    const evalAll = () => {
      let s = 0, mx = 0;
      for (let i = 0; i < m; i++) {
        const q = eqs[i], v = vb[i];
        for (let k = 0; k < q.p.length; k++) v[k] = X[q.p[k]];
        const r = q.f(v);
        g[i] = r; s += r * r;
        const a = Math.abs(r);
        if (!(a <= mx)) mx = a;
      }
      err2 = Number.isFinite(s) ? s : Infinity;
      errMax = Number.isFinite(mx) ? mx : Infinity;
    };
    evalAll();
    const rowsIdx = new Array(m), rowsVal = new Array(m);
    const Jd = new Float64Array(m * n);
    const A = new Float64Array(m * m), M = new Float64Array(m * m);
    const y = new Float64Array(m), delta = new Float64Array(n), X0 = new Float64Array(n);
    let lambda = 1e-10;
    for (let it = 0; it < maxIter; it++) {
      if (errMax < tol) return { ok: true, err: errMax, it };
      Jd.fill(0);
      for (let i = 0; i < m; i++) {

        for (let k = 0; k < q.p.length; k++) v[k] = X[q.p[k]];
        const idx = [], val = [];
        for (let k = 0; k < L.length; k++) {
          const j = L[k];

          const x0 = v[k], h = 1e-7 * Math.max(1, Math.abs(x0));

          v[k] = x0;
          const dv = (f1 - f2) / (2 * h);
          if (dv !== 0 && Number.isFinite(dv)) { idx.push(j); val.push(dv); Jd[i * n + j] = dv; }

        rowsIdx[i] = idx; rowsVal[i] = val;

      let tr = 0;
      for (let i = 0; i < m; i++) {
        const I = rowsIdx[i], V = rowsVal[i];
        for (let j = 0; j <= i; j++) {
          let s = 0; const off = j * n;
          for (let k = 0; k < I.length; k++) s += V[k] * w[I[k]] * Jd[off + I[k]];

        }

      for (let attempt = 0; attempt < 7 && !accepted; attempt++) {
        M.set(A);
        for (let i = 0; i < m; i++) M[i * m + i] += lambda * tr;
        if (!cholSolve(M, m, g, y)) { lambda = Math.max(lambda * 100, 1e-8); continue; }
        delta.fill(0);
        for (let i = 0; i < m; i++) {
          const I = rowsIdx[i], V = rowsVal[i], yi = y[i];
          for (let k = 0; k < I.length; k++) delta[I[k]] -= w[I[k]] * V[k] * yi;
        }
        for (let j = 0; j < n; j++) X0[j] = X[cols[j]];

        for (let ls = 0; ls < 7; ls++) {

          if (err2 < e0 * (1 - 1e-4 * alpha) || errMax < tol) { accepted = true; break; }
          alpha *= 0.5;
        }
        if (!accepted) {

          evalAll();

      lambda = Math.max(lambda * 0.1, 1e-12);

  }

  function solve(sk, opt = {}) {
    const eqs = buildEquations(sk);
    const fixed = opt.fixed || fixedParams(sk);
    const tol = opt.tol || 1e-9, maxIter = opt.maxIter || 80;
    const { clusters, fixedOnly } = groupEquations(eqs, fixed, sk.X.length);
    let ok = true, err = 0;
    for (const q of fixedOnly) {
      const r = Math.abs(evalEq(sk.X, q));
      if (!(r < 1e-7)) ok = false;
      err = Math.max(err, Number.isFinite(r) ? r : Infinity);
    }
    for (const cl of clusters) {
      if (opt.focus && !cl.cols.some((p) => opt.focus.has(p))) {
        let bad = false;
        for (const q of cl.eqs) if (!(Math.abs(evalEq(sk.X, q)) < tol * 10)) { bad = true; break; }
        if (!bad) continue;
      }
      const r = solveCluster(sk.X, cl.eqs, cl.cols, opt.weights, tol, maxIter);
      if (!r.ok) ok = false;
      if (r.err > err) err = r.err;
    }
    return { ok, err };
  }

  /* Entities shrunk to nothing (zero-length line, zero radius). A solve
     that creates a new one is rejected, as SolidWorks does. */
  function degenerateSet(sk) {
    const s = new Set();
    for (const e of sk.ents.values()) {
      if (e.type === 'line') { const a = sk.P(e.p1), b = sk.P(e.p2); if (!(hyp(b.x - a.x, b.y - a.y) > 1e-6)) s.add(e.id); }
      else if (e.type === 'circle') { if (!(sk.X[e.r] > 1e-6)) s.add(e.id); }
      else if (e.type === 'arc') {
        const c = sk.P(e.c), a = sk.P(e.p1), b = sk.P(e.p2);
        if (!(hyp(a.x - c.x, a.y - c.y) > 1e-6) || !(hyp(b.x - a.x, b.y - a.y) > 1e-9)) s.add(e.id);
      }
    }
    return s;
  }
  function collapsed(sk, before) {
    for (const id of degenerateSet(sk)) if (!before.has(id)) return true;
    return false;
  }

  /* ------------------------------------------------------------------
     Analysis: which parameters are pinned down, which constraints are
     redundant, and how many degrees of freedom remain.
     ------------------------------------------------------------------ */
  function jacRowDense(X, q, colOf, n) {
    const row = new Float64Array(n);
    const v = new Float64Array(q.p.length);
    for (let k = 0; k < q.p.length; k++) v[k] = X[q.p[k]];
    for (let k = 0; k < q.p.length; k++) {
      const j = colOf.get(q.p[k]);
      if (j === undefined) continue;
      const x0 = v[k], h = 1e-7 * Math.max(1, Math.abs(x0));
      v[k] = x0 + h; const f1 = q.f(v);
      v[k] = x0 - h; const f2 = q.f(v);
      v[k] = x0;
      const dv = (f1 - f2) / (2 * h);
      if (Number.isFinite(dv)) row[j] = dv;
    }
    return row;
  }
  function vdot(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }
  function vnorm(a) { return Math.sqrt(vdot(a, a)); }

  /* Modified Gram-Schmidt over rows, in order. Returns the basis and the
     list of equations that were linearly dependent on earlier ones. */
  function orthoRows(X, eqs, cols) {
    const n = cols.length, colOf = new Map();
    cols.forEach((p, j) => colOf.set(p, j));
    const Q = [], dep = [];
    for (const q of eqs) {
      const row = jacRowDense(X, q, colOf, n);
      let nr = vnorm(row);
      if (!(nr > 1e-12)) { dep.push(q); continue; }
      for (let i = 0; i < n; i++) row[i] /= nr;
      for (let pass = 0; pass < 2; pass++) {
        for (const b of Q) { const d = vdot(row, b); if (d !== 0) for (let i = 0; i < n; i++) row[i] -= d * b[i]; }
      }
      nr = vnorm(row);
      if (nr < 1e-6) { dep.push(q); continue; }
      for (let i = 0; i < n; i++) row[i] /= nr;
      Q.push(row);
    }
    return { Q, dep };
  }

  function analyze(sk) {
    const eqs = buildEquations(sk);
    const fixed = fixedParams(sk);
    const live = liveParams(sk);
    const X = sk.X;
    const { clusters, fixedOnly } = groupEquations(eqs, fixed, X.length);
    const determined = new Set(fixed);
    const redundant = new Set(), unsat = new Set(), badEnts = new Set();
    const mark = (q) => { if (q.cid) redundant.add(q.cid); else if (q.ent) badEnts.add(q.ent); };
    for (const q of eqs) {
      const r = evalEq(X, q);
      if (!(Math.abs(r) < 1e-6)) { if (q.cid) unsat.add(q.cid); else if (q.ent) badEnts.add(q.ent); }
    }
    for (const q of fixedOnly) mark(q);
    let rank = 0;
    for (const cl of clusters) {
      const { Q, dep } = orthoRows(X, cl.eqs, cl.cols);
      for (const q of dep) mark(q);
      rank += Q.length;
      const n = cl.cols.length;
      for (let j = 0; j < n; j++) {
        let s = 0;
        for (const b of Q) s += b[j] * b[j];
        if (s > 1 - 1e-7) determined.add(cl.cols[j]);
      }
    }
    let unknown = 0;
    for (const p of live) if (!fixed.has(p)) unknown++;
    const dof = Math.max(0, unknown - rank);
    const over = new Set();
    const addOver = (id) => { const e = sk.ents.get(id); if (!e) return; over.add(id); if (e.type === 'point' && e.owner) over.add(e.owner); };
    for (const cid of redundant) { const c = sk.cons.get(cid); if (c) c.refs.forEach(addOver); }
    for (const cid of unsat) { const c = sk.cons.get(cid); if (c) c.refs.forEach(addOver); }
    for (const id of badEnts) addOver(id);
    const entStatus = new Map();
    for (const e of sk.ents.values()) {
      if (over.has(e.id)) { entStatus.set(e.id, 'over'); continue; }
      const ps = sk.paramsOf(e.id);
      entStatus.set(e.id, ps.every((p) => determined.has(p)) ? 'full' : 'under');
    }
    const status = redundant.size || unsat.size || badEnts.size ? 'over' : dof === 0 ? 'full' : 'under';
    return { dof, determined, redundant, unsat, badEnts, entStatus, status, fixed };
  }

  /* Would constraint `cid` (already added) repeat what other constraints
     already say? Checked on the clusters it touches only. */
  function isRedundant(sk, cid) {
    const eqs = buildEquations(sk);
    const fixed = fixedParams(sk);
    const newEqs = eqs.filter((q) => q.cid === cid);
    if (!newEqs.length) return false;
    const { clusters, fixedOnly } = groupEquations(eqs, fixed, sk.X.length);
    if (fixedOnly.some((q) => q.cid === cid)) return true;

          this.dl = dl || null;
          if (db && user) { const id = await user.id(); if (id) { this.db = db; this.uid = id; } }

  get cloud() { return !!(this.db && this.uid); },
  col() { return this.db.collection('data/users/' + this.uid); },

/* ---- Croquis UI, part 5: notes — annotation layers tied to the geometry ---- */

const NOTE_TOOLS = { ntext: 'text', nforce: 'force', nmoment: 'moment', nload: 'load', nsupport: 'support', nspring: 'spring', ndamper: 'damper', nframe: 'frame', nmass: 'mass' };
const NOTE_NAMES = { text: 'Text note', force: 'Force', moment: 'Torque', load: 'Distributed load', support: 'Support', spring: 'Spring', damper: 'Damper', frame: 'Coordinate frame', mass: 'Center of mass' };
const NOTE_ICONS = { text: 'i-text', force: 'i-force', moment: 'i-torque', load: 'i-load', support: 'i-support', spring: 'i-spring', damper: 'i-damper', frame: 'i-frame', mass: 'i-mass' };
const SUPPORT_KINDS = [['fixed', 'Fixed'], ['pin', 'Pinned'], ['roller', 'Roller']];
const FONT_UI = '"Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif';
const norm360 = (a) => ((a % 360) + 360) % 360;
const norm180 = (a) => norm360(a + 180) - 180;

function isNoteTool(name) { return Object.prototype.hasOwnProperty.call(NOTE_TOOLS, name); }
function noteLayerOf(n) { return app.sk.layers.get(n.layer) || null; }
function noteVisible(n) { if (n.hidden) return false; const l = noteLayerOf(n); return !l || !l.hidden; }
function noteLocked(n) { const l = noteLayerOf(n); return !!(l && l.locked); }
function noteHasText(n) { return !!n && n.type !== 'support'; }
function noteColor(R, n) {
  const l = noteLayerOf(n);
  const key = n.color || (l && l.color) || 'magenta';
  return colorOf(key, R.exp ? false : DARK) || (R.exp ? '#111418' : PAL.ink);
}
function noteWidth(n) { return n.w || (n.type === 'text' ? 1.2 : n.type === 'support' || n.type === 'mass' || n.type === 'frame' ? 1.4 : 1.8); }

/* F_1 -> F₁, m^2 -> m², x_{max} -> xₘₐₓ (only when every character exists). */
const SUB = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', a: 'ₐ', e: 'ₑ', h: 'ₕ', i: 'ᵢ', j: 'ⱼ', k: 'ₖ', l: 'ₗ', m: 'ₘ', n: 'ₙ', o: 'ₒ', p: 'ₚ', r: 'ᵣ', s: 'ₛ', t: 'ₜ', u: 'ᵤ', v: 'ᵥ', x: 'ₓ', '+': '₊', '-': '₋', '=': '₌', '(': '₍', ')': '₎' };
const SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', '+': '⁺', '-': '⁻', n: 'ⁿ', i: 'ⁱ' };
function scriptText(s) {
  const conv = (map, str) => ([...str].every((ch) => map[ch]) ? [...str].map((ch) => map[ch]).join('') : null);
  return String(s == null ? '' : s)
    .replace(/_\{([^}]*)\}/g, (m, g) => conv(SUB, g) || m)
    .replace(/\^\{([^}]*)\}/g, (m, g) => conv(SUP, g) || m)
    .replace(/_([0-9a-z]+)/g, (m, g) => conv(SUB, g) || m)
    .replace(/\^([0-9+-]+)/g, (m, g) => conv(SUP, g) || m);
}

/* ---------- geometry helpers (screen space) ---------- */
function aS(R, a) { const p = app.sk.anchorPos(a); return p ? R.toS(p.x, p.y) : null; }
function headPts(tx, ty, dx, dy, len, half) {
  return [tx, ty, tx - dx * len - dy * half, ty - dy * len + dx * half, tx - dx * len + dy * half, ty - dy * len - dx * half];
}
/* Points along a circle from world angle a0 to a1. */
function arcPts(C, r, a0, a1) {
  const n = Math.max(6, Math.ceil(Math.abs(a1 - a0) * r / 5));
  const out = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; out.push(C[0] + r * Math.cos(a), C[1] - r * Math.sin(a)); }
  return out;
}
/* A filled sector, canvas angles (y down). */
function sectorPts(C, r, a0, a1) {
  const out = [C[0], C[1]];
  for (let i = 0; i <= 10; i++) { const a = a0 + (a1 - a0) * i / 10; out.push(C[0] + r * Math.cos(a), C[1] + r * Math.sin(a)); }
  return out;
}
function textItem(R, str, size, weight) {
  const ctx = R.ctx;
  const font = (weight || 500) + ' ' + size + 'px ' + FONT_UI;
  ctx.font = font;
  const lines = scriptText(str).split('\n');
  const lh = Math.round(size * 1.25);
  let w = 0;
  for (const ln of lines) w = Math.max(w, ctx.measureText(ln).width);
  return { t: 'text', lines, font, size, lh, w: Math.ceil(w), h: lh * lines.length, x: 0, y: 0, pad: 2, bg: true };
}
/* Puts a text box just past (px, py) in direction (dx, dy). */
function boxBeyond(it, px, py, dx, dy, gap) {
  const ext = Math.abs(dx) * it.w / 2 + Math.abs(dy) * it.h / 2;
  it.x = px + dx * (gap + ext) - it.w / 2;
  it.y = py + dy * (gap + ext) - it.h / 2;

}
function attachPoint(box, ax, ay) {
  const mid = box.y + box.h / 2;
  if (ax < box.x) return [box.x, mid];
  if (ax > box.x + box.w) return [box.x + box.w, mid];
  return [clamp(ax, box.x, box.x + box.w), ay < box.y ? box.y : box.y + box.h];

/* ---------- display lists: one per note, shared by drawing, picking and export ---------- */
function noteDL(R, n) {
  const sk = app.sk, s = R.s, w = noteWidth(n);
  const items = [];
  let label = null;
  const ends = {};
  const line = (pts, o) => items.push(Object.assign({ t: 'pl', pts, w }, o || {}));
  const fill = (pts) => items.push({ t: 'fill', pts });
  const circ = (x, y, r, f, o) => items.push(Object.assign({ t: 'circ', x, y, r, fill: !!f, w }, o || {}));
  const lab = (it) => { if (n.lab) { it.x += n.lab.x * s; it.y -= n.lab.y * s; } label = it; items.push(it); };

  switch (n.type) {
    case 'force': {
      const A = aS(R, n.a);
      if (!A) return null;
      const th = sk.dirAngle(n.dir) * DEG, dx = Math.cos(th), dy = -Math.sin(th);
      const L = Math.max((+n.len || 0) * s, hl + 6);
      let tx, ty, hx, hy;
      if (n.head) { hx = A[0]; hy = A[1]; tx = hx - dx * L; ty = hy - dy * L; }
      else { tx = A[0]; ty = A[1]; hx = tx + dx * L; hy = ty + dy * L; }
      line([tx, ty, hx - dx * hl * 0.9, hy - dy * hl * 0.9]);
      fill(headPts(hx, hy, dx, dy, hl, hh));
      ends.tail = [tx, ty]; ends.head = [hx, hy];
      if (n.text) {
        const it = textItem(R, n.text, 14, 600), sg = n.head ? -1 : 1;
        boxBeyond(it, n.head ? tx : hx, n.head ? ty : hy, dx * sg, dy * sg, 5);

    }
    case 'moment': {
      const C = aS(R, n.a);
      if (!C) return null;
      const r = Math.max((+n.r || 0) * s, 10), sg = n.ccw ? 1 : -1;
      const th = n.ang * DEG, sw = clamp(n.sweep, 30, 350) * DEG;
      const stop = th - sg * Math.min(hl * 0.85 / r, sw * 0.4);
      line(arcPts(C, r, th - sg * sw, stop));
      const hx = C[0] + r * Math.cos(th), hy = C[1] - r * Math.sin(th);
      const bx = C[0] + r * Math.cos(stop), by = C[1] - r * Math.sin(stop);
      const dl = hyp(hx - bx, hy - by) || 1;
      fill(headPts(hx, hy, (hx - bx) / dl, (hy - by) / dl, hl, hh));
      circ(C[0], C[1], 2.2, true);
      ends.head = [hx, hy];
      if (n.text) {
        const it = textItem(R, n.text, 14, 600), am = th - sg * sw / 2;
        boxBeyond(it, C[0] + r * Math.cos(am), C[1] - r * Math.sin(am), Math.cos(am), -Math.sin(am), 5);
        lab(it);
      }
      break;
    }
    case 'load': {
      const A = aS(R, n.a), B = aS(R, n.b);
      if (!A || !B) return null;

        const bx = A[0] + dx * t, by = A[1] + dy * t, tx = bx + nx * q, ty = by + ny * q;

    }
    case 'frame': {

      if (!O) return null;

      const axes = [[Math.cos(th), -Math.sin(th), n.lx], [-Math.sin(th), -Math.cos(th), n.ly]];
      axes.forEach(([dx, dy, name], i) => {
        const hx = O[0] + dx * L, hy = O[1] + dy * L;
        line([O[0], O[1], hx - dx * hl * 0.9, hy - dy * hl * 0.9]);
        fill(headPts(hx, hy, dx, dy, hl, hh));
        if (name) { const it = textItem(R, name, 13, 600); boxBeyond(it, hx, hy, dx, dy, 3); it.bg = false; items.push(it); }
        if (i === 0) ends.x = [hx, hy];
      });
      circ(O[0], O[1], 2.6, true);
      if (n.text) {
        const it = textItem(R, n.text, 13, 600);
        const dx = -(axes[0][0] + axes[1][0]), dy = -(axes[0][1] + axes[1][1]), dl = hyp(dx, dy) || 1;

  app.selGroups = gs;

}

/* ---------- hide and show ---------- */
function hideTargets() {
  const sk = app.sk, t = { groups: new Set(app.selGroups), ents: new Set(), dims: new Set(), notes: new Set() };
  for (const k of app.sel) {
    const id = +k.slice(1);
    if (k[0] === 'e') {
      const top = sk.get(sk.topOf(id));
      if (!top || top.origin) continue;
      if (top.group) t.groups.add(top.group); else t.ents.add(top.id);
    } else if (k[0] === 'c') {
      const c = sk.cons.get(id);
      if (!c || !c.dim) continue;
      if (c.group) t.groups.add(c.group); else t.dims.add(c.id);
    } else if (k[0] === 'n') t.notes.add(id);
  }
  return t;
}
const targetCount = (t) => t.groups.size + t.ents.size + t.dims.size + t.notes.size;
function targetsAlive(t) {
  const sk = app.sk;
  return [...t.groups].some((g) => sk.groups.has(g)) || [...t.ents].some((id) => sk.ents.has(id))
    || [...t.dims].some((id) => sk.cons.has(id)) || [...t.notes].some((id) => sk.notes.has(id));
}
const sameSet = (a, b) => a.size === b.size && [...a].every((x) => b.has(x));
/* H: hides what is selected (whole groups for grouped items). The hidden
   set stays selected, so pressing H again shows it. */
function hideToggle() {
  const sk = app.sk;
  let t = hideTargets();
  if (!app.sel.length && app.hideMemo && targetsAlive(app.hideMemo) && (!app.selGroups.length || sameSet(new Set(app.selGroups), app.hideMemo.groups))) t = app.hideMemo;
  if (!targetCount(t)) {
    if (app.hideMemo && targetsAlive(app.hideMemo)) t = app.hideMemo;
    else { toast('Select geometry, dimensions, notes or a group in the Browser, then press H.'); return; }
  }
  const isHidden = (kind, id) => {
    const o = kind === 'g' ? sk.groups.get(id) : kind === 'e' ? sk.get(id) : kind === 'c' ? sk.cons.get(id) : sk.notes.get(id);
    return !o || !!o.hidden;
  };
  const all = [...[...t.groups].map((id) => ['g', id]), ...[...t.ents].map((id) => ['e', id]), ...[...t.dims].map((id) => ['c', id]), ...[...t.notes].map((id) => ['n', id])];
  const hide = !all.every(([k, id]) => isHidden(k, id));
  const before = snapshot();
  for (const [k, id] of all) {
    const o = k === 'g' ? sk.groups.get(id) : k === 'e' ? sk.get(id) : k === 'c' ? sk.cons.get(id) : sk.notes.get(id);
    if (!o) continue;
    if (hide) o.hidden = true; else delete o.hidden;
    if (k === 'g') o.hidden = hide;
  }
  app.hideMemo = { groups: new Set(t.groups), ents: new Set(t.ents), dims: new Set(t.dims), notes: new Set(t.notes) };
  app.selGroups = [...t.groups].filter((g) => sk.groups.has(g));
  if (hide) app.sel = [];
  else app.sel = [...groupMembers(app.selGroups), ...[...t.ents].map(keyE), ...[...t.dims].map(keyC), ...[...t.notes].map(keyN)];
  commit(before);
  const n = all.length;
  toast(hide ? 'Hidden. Press H to show ' + (n === 1 ? 'it' : 'them') + ' again, Shift+H to show everything.' : 'Shown again.');
}
function hiddenSummary() {
  const sk = app.sk;
  if (!sk) return { count: 0, text: '' };
  let g = 0, e = 0, d = 0, n = 0, l = 0;
  for (const x of sk.groups.values()) if (x.hidden) g++;
  for (const x of sk.ents.values()) if (x.hidden) e++;
  for (const x of sk.cons.values()) if (x.dim && x.hidden) d++;
  for (const x of sk.notes.values()) if (x.hidden) n++;
  for (const x of sk.layers.values()) if (x.hidden) l++;
  const pl = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');
  const parts = [];
  if (g) parts.push(pl(g, 'group'));
  if (e) parts.push(pl(e, 'sketch entity').replace('entitys', 'entities'));
  if (d) parts.push(pl(d, 'dimension'));
  if (n) parts.push(pl(n, 'note'));
  if (l) parts.push(pl(l, 'note layer'));
  const count = g + e + d + n + l;
  const text = parts.length ? (parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts[0]) + (count === 1 ? ' is hidden.' : ' are hidden.') : '';
  return { count, text };
}
function showAllHidden() {
  const sk = app.sk, { count } = hiddenSummary();
  if (!count) { toast('Nothing is hidden.'); return; }
  const before = snapshot();
  for (const x of sk.groups.values()) x.hidden = false;
  for (const x of sk.ents.values()) delete x.hidden;
  for (const x of sk.cons.values()) delete x.hidden;
  for (const x of sk.notes.values()) delete x.hidden;
  for (const x of sk.layers.values()) x.hidden = false;

}
function setGroupHidden(gids, hidden) {
  const sk = app.sk, before = snapshot();
  for (const id of gids) { const g = sk.groups.get(id); if (g) g.hidden = hidden; }
  app.hideMemo = { groups: new Set(gids), ents: new Set(), dims: new Set(), notes: new Set() };
  commit(before);
}

/* ---------- note layers ---------- */
function newLayer() {

  const used = new Set([...sk.layers.values()].map((l) => l.color));
  const color = LAYER_COLORS.find((c) => !used.has(c)) || LAYER_COLORS[sk.layers.size % LAYER_COLORS.length];
  const id = sk.addLayer(sk.layers.size ? null : 'Notes', color);
