/* ---------- tabs: several drawings open at once ---------- */
/* Each tab keeps its own sketch, undo history, view and file info. The
   active tab lives in `app`; the others wait in tabs.list. */
const tabs = { list: [], active: null };
const newTabId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const activeTab = () => tabs.list.find((t) => t.id === tabs.active) || null;
function captureTab(t) {
  if (!t) return;
  t.sk = app.sk; t.undo = app.undo; t.redo = app.redo; t.doc = app.doc; t.V = Object.assign({}, app.V); t.hideMemo = app.hideMemo;
}
function tabPristine(t) {
  const sk = t.sk;
  return !!(t.doc && sk && !t.doc.dirty && !t.doc.id && !t.doc.example && sk.ents.size <= 1 && !sk.notes.size && !sk.pictures.size && !sk.sheet && !(t.undo && t.undo.length));
}
function persistTab(t) {
  if (app.readonly || !t || !t.sk) return;
  lsSet(lsTabKey(t.id), JSON.stringify({ doc: t.doc, view: t.V, sketch: t.sk.toJSON() }));
}
function saveTabIndex() {
  if (app.readonly) return;
  lsSet(LS_TABS, JSON.stringify({ active: tabs.active, order: tabs.list.map((t) => t.id) }));
}
function saveTabDraft() {
  if (app.readonly || !tabs.active || !app.sk) return;
  const t = activeTab();
  if (t) captureTab(t);
  lsSet(lsTabKey(tabs.active), JSON.stringify({ doc: app.doc, view: app.V, sketch: app.sk.toJSON() }));
  saveTabIndex();
}
function restoreTab(t) {
  app.sk = t.sk; app.undo = t.undo || []; app.redo = t.redo || []; app.doc = t.doc; app.hideMemo = t.hideMemo || null;
  app.sel = []; app.selGroups = []; app.hover = null; app.hoverCon = null; app.hoverGroup = 0;
  app.an = K.analyze(app.sk);
  $('docName').value = app.doc.name;
  setTool('select');
  if (t.V && t.V.s > 0) app.V = Object.assign({}, t.V); else zoomFit();
  refresh();
  setSaveState();
  ensureAssets(app.sk);
}
function switchTab(id) {
  if (id === tabs.active) return;
  const next = tabs.list.find((t) => t.id === id);
  if (!next) return;
  cancelTransient();
  closeNoteEditor(true);
  hidePop();
  const cur = activeTab();
  if (cur) { captureTab(cur); persistTab(cur); }
  tabs.active = id;
  restoreTab(next);
  saveTabIndex();
  renderTabs();
}
/* Opens a sketch in a new tab, or in the current one if it is an
   untouched empty drawing. */
function openInTab(sk, meta, view) {
  const cur = activeTab();
  if (cur) captureTab(cur);
  if (!cur || !tabPristine(cur)) {
    if (cur) persistTab(cur);
    cancelTransient();
    const t = { id: newTabId() };
    tabs.list.push(t);
    tabs.active = t.id;
  }
  loadSketch(sk, meta, view);
  captureTab(activeTab());
  saveTabIndex();
  renderTabs();
}
async function closeTab(id) {
  const t = tabs.list.find((x) => x.id === id);
  if (!t) return;
  if (t.id === tabs.active) captureTab(t);
  const empty = t.sk && t.sk.ents.size <= 1 && !t.sk.notes.size && !t.sk.pictures.size;
  if (t.doc.dirty && !t.doc.example && !empty) {
    const ok = await confirmBox('Close “' + (t.doc.name || 'Untitled sketch') + '”?', 'It has changes that are not saved. Closing the tab discards them.', 'Close without saving', 'Keep it open');
    if (!ok) return;
  }
  const i = tabs.list.indexOf(t);
  if (i < 0) return;
  tabs.list.splice(i, 1);
  lsDel(lsTabKey(t.id));
  if (!tabs.list.length) {
    const nt = { id: newTabId() };
    tabs.list.push(nt);
    tabs.active = nt.id;
    loadSketch(new K.Sketch(), { name: 'Untitled sketch' }, { cx: 30, cy: 20, s: Math.max(2, Math.min(app.W / 160, app.H / 110)) });
    captureTab(nt);
  } else if (tabs.active === t.id) {
    cancelTransient();
    const nx = tabs.list[Math.min(i, tabs.list.length - 1)];
    tabs.active = nx.id;
    restoreTab(nx);
  }
  saveTabIndex();
  renderTabs();
}
function renderTabs() {
  const bar = $('docTabs');
  if (!bar || app.readonly) return;
  const items = tabs.list.map((t) => {
    const doc = t.id === tabs.active ? app.doc : t.doc;
    if (!doc) return null;
    const name = doc.name || 'Untitled sketch';
    const x = el('button', { class: 'dt-x', type: 'button', title: 'Close ' + name, 'aria-label': 'Close ' + name, tabindex: '-1' }, svgUse('i-x', 'i sm'));
    x.addEventListener('click', (e) => { e.stopPropagation(); closeTab(t.id); });
    const tab = el('div', {
      class: 'dtab', role: 'tab', tabindex: t.id === tabs.active ? '0' : '-1', 'aria-selected': String(t.id === tabs.active),
      title: name + (doc.dirty && !doc.example ? ' (unsaved changes)' : ''),
    }, doc.dirty && !doc.example ? el('span', { class: 'dt-dot', 'aria-hidden': 'true' }) : null, el('span', { class: 'dt-name', text: name }), x);
    tab.addEventListener('click', () => switchTab(t.id));
    tab.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); closeTab(t.id); } });
    tab.addEventListener('dblclick', () => { const n = $('docName'); n.focus(); n.select(); });
    tab.addEventListener('keydown', (e) => {
      const i = tabs.list.indexOf(t);
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault(); e.stopPropagation();
        const nx = tabs.list[(i + (e.key === 'ArrowRight' ? 1 : tabs.list.length - 1)) % tabs.list.length];
        switchTab(nx.id);
        requestAnimationFrame(() => { const b = document.querySelector('.dtab[aria-selected="true"]'); if (b) b.focus(); });
      } else if (e.key === 'Delete') { e.preventDefault(); e.stopPropagation(); closeTab(t.id); }
    });
    return tab;
  });
  const plus = el('button', { class: 'dtab-new', type: 'button', title: 'New drawing in a new tab', 'aria-label': 'New drawing' }, svgUse('i-plus', 'i sm'));
  plus.addEventListener('click', newDoc);
  bar.replaceChildren(...items.filter(Boolean), plus);
  const act = bar.querySelector('.dtab[aria-selected="true"]');
  if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function restoreTabs() {
  let idx = null;
  try { idx = JSON.parse(lsGet(LS_TABS) || 'null'); } catch (e) { idx = null; }
  const order = idx && Array.isArray(idx.order) ? idx.order : [];
  for (const id of order) {
    if (typeof id !== 'string' || !/^t\w{1,40}$/.test(id) || tabs.list.some((t) => t.id === id)) continue;
    try {
      const d = JSON.parse(lsGet(lsTabKey(id)) || 'null');
      if (!d || !d.sketch) continue;
      const sk = K.Sketch.fromJSON(d.sketch);
      K.solve(sk);
      const doc = Object.assign({ id: null, name: 'Untitled sketch', where: null, dirty: false, example: false }, d.doc || {});
      const v = d.view;
      tabs.list.push({ id, sk, undo: [], redo: [], doc, V: v && v.s > 0 && Number.isFinite(v.cx) && Number.isFinite(v.cy) ? { cx: v.cx, cy: v.cy, s: v.s } : null, hideMemo: null });
    } catch (e) { /* skip a damaged draft */ }
  }
  // drafts of tabs that are no longer open
  try {
    const keep = new Set(tabs.list.map((t) => lsTabKey(t.id)));
    for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith('croquis:tab:') && !keep.has(k)) localStorage.removeItem(k); }
  } catch (e) { /* storage unavailable */ }
  if (!tabs.list.length) {
    const t = { id: newTabId() };
    tabs.list.push(t);
    tabs.active = t.id;
    loadExample();
    captureTab(t);
  } else {
    const a = tabs.list.find((t) => t.id === (idx && idx.active)) || tabs.list[0];
    tabs.active = a.id;
    restoreTab(a);
  }
  saveTabIndex();
  renderTabs();
}

/* ---------- share links: the whole drawing travels in the link ---------- */
/* Nothing is uploaded: the sketch is compressed into the part of the URL
   after #, which browsers never send to a server. */
const b64u = {
  enc(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  dec(str) {
    const s = atob(String(str).replace(/-/g, '+').replace(/_/g, '/'));
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  },
};
const streamBytes = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
async function encodeShare(obj) {
  const json = JSON.stringify(obj, (k, v) => (typeof v === 'number' && Number.isFinite(v) ? +v.toPrecision(10) : v));
  const bytes = new TextEncoder().encode(json);
  if (window.CompressionStream) {
    try { return 'z' + b64u.enc(await streamBytes(bytes, new CompressionStream('deflate-raw'))); } catch (e) { /* plain below */ }
  }
  return 'j' + b64u.enc(bytes);
}
async function decodeShare(str) {
  const kind = String(str || '')[0];
  let bytes;
  try { bytes = b64u.dec(String(str).slice(1)); } catch (e) { throw new Error('This link is damaged: part of it may be missing.'); }
  if (kind === 'z') {
    if (!window.DecompressionStream) throw new Error('This browser cannot open drawing links. Try a recent Chrome, Edge, Firefox or Safari.');
    try { bytes = await streamBytes(bytes, new DecompressionStream('deflate-raw')); } catch (e) { throw new Error('This link is damaged: part of it may be missing.'); }
  } else if (kind !== 'j') throw new Error('This link does not contain a Croquis drawing.');
  return JSON.parse(new TextDecoder().decode(bytes));
}
function shareBase() {
  if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin + location.pathname;
  return APP_URL;
}
function hashParams() { return new URLSearchParams(location.hash.replace(/^#/, '')); }
/* What a link points at: drawing data inside the link, or a .json file
   hosted elsewhere (src=…) that is fetched fresh each time. */
async function loadSharedPayload(hp, key) {
  const data = hp.get(key);
  if (data) {
    const p = await decodeShare(data);
    if (!p || !p.s) throw new Error('This link does not contain a Croquis drawing.');
    return { name: String(p.n || 'Shared drawing').slice(0, 120), sketch: p.s, assets: null };
  }
  const src = hp.get('src');
  if (!src) throw new Error('This link does not contain a drawing.');
  let url;
  try { url = new URL(src, location.href); } catch (e) { throw new Error('The drawing address is not valid.'); }
  if (url.protocol !== 'https:' && url.protocol !== 'http:') throw new Error('The drawing address must start with https://.');
  let res;
  try { res = await fetch(url.href, { cache: 'no-cache' }); } catch (e) { throw new Error('The drawing file could not be fetched. Its server must allow other sites to read it (CORS), as GitHub raw files and Gists do.'); }
  if (!res.ok) throw new Error('The drawing file could not be fetched (HTTP ' + res.status + ').');
  const j = await res.json().catch(() => { throw new Error('The drawing file is not a Croquis .json export.'); });
  const fname = decodeURIComponent(url.pathname.split('/').pop() || 'drawing').replace(/\.json$/i, '');
  return { name: String(j.name || fname).slice(0, 120), sketch: j, assets: j.assets || null, src: url.href };
}
function sketchFromPayload(p) {
  const sk = K.Sketch.fromJSON(p.sketch);
  K.solve(sk);
  return sk;
}
/* An editable link opens a copy in a new tab of the editor. */
async function importSharedLink(hp) {
  try {
    const p = await loadSharedPayload(hp, 'edit');
    if (p.assets) await storeAssets(p.assets);
    openInTab(sketchFromPayload(p), { name: p.name, dirty: true });
    toast('Opened a copy of “' + p.name + '”. It is yours to change: save it to keep it.');
  } catch (e) { toast(e.message || 'This link could not be opened.', 'err'); }
  history.replaceState(null, '', location.pathname + location.search);
}

/* ---------- viewer and embed modes ---------- */
async function startViewer(mode, hp) {
  app.readonly = true;
  app.embed = mode === 'embed';
  document.body.classList.add('viewer');
  if (app.embed) document.body.classList.add('embed');
  $('viewBar').hidden = app.embed;
  openSide(false);
  const th = hp.get('theme');
  if (th === 'light' || th === 'dark') { document.documentElement.setAttribute('data-theme', th); readPalette(); }
  app.showDims = hp.get('dims') !== '0';
  app.showRel = hp.get('rel') === '1';
  app.viewNotes = hp.get('notes') !== '0';
  app.viewSheet = hp.get('sheet') !== '0';
  $('btnRel').setAttribute('aria-pressed', String(app.showRel));
  $('btnDims').setAttribute('aria-pressed', String(app.showDims));
  app.sk = new K.Sketch();
  app.doc = { id: null, name: 'Loading…', where: null, dirty: false, example: false };
  app.an = K.analyze(app.sk);
  $('vbName').textContent = 'Loading the drawing…';
  refresh();
  const key = mode;
  const load = async (refit) => {
    try {
      const p = await loadSharedPayload(hp, key);
      if (p.assets) await storeAssets(p.assets);
      const keepView = !refit && app.V ? Object.assign({}, app.V) : null;
      loadSketch(sketchFromPayload(p), { name: p.name });
      if (!app.viewNotes) for (const l of app.sk.layers.values()) l.hidden = true;
      if (!app.viewSheet && app.sk.sheet) app.sk.sheet.show = false;
      app.an = K.analyze(app.sk);
      if (keepView) app.V = keepView; else zoomFit();
      document.title = p.name + ' · Croquis';
      $('vbName').textContent = p.name;
      $('vbNote').textContent = p.src ? 'View only · live from ' + new URL(p.src).hostname : 'View only';
      const open = $('embedOpen');
      open.hidden = !app.embed;
      open.href = shareBase() + '#view' + (hp.get(key) ? '=' + hp.get(key) : '&src=' + encodeURIComponent(p.src || ''));
      refresh();
    } catch (e) {
      $('vbName').textContent = 'This drawing could not be opened';
      $('vbNote').textContent = e.message || 'Unknown problem';
      toast(e.message || 'This drawing could not be opened.', 'err');
    }
  };
  await load(true);
  // a hosted file is read again whenever the page comes back into view
  if (!hp.get(key) && hp.get('src')) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(false); });
  $('vbFit').addEventListener('click', zoomFit);
  $('vbEdit').addEventListener('click', () => {
    const q = hp.get(key) ? 'edit=' + hp.get(key) : 'edit&src=' + encodeURIComponent(hp.get('src') || '');
    history.replaceState(null, '', location.pathname + location.search + '#' + q);
    location.reload();
  });
}
function startDocuments() {
  window.addEventListener('hashchange', () => { const h = hashParams(); if (h.has('view') || h.has('embed') || (h.has('edit') && !app.readonly)) location.reload(); });
  const hp = hashParams();
  if (hp.has('embed')) { startViewer('embed', hp); return; }
  if (hp.has('view')) { startViewer('view', hp); return; }
  restoreTabs();
  if (hp.has('edit')) importSharedLink(hp);
}

/* ---------- small dialog helpers ---------- */
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || 'Copied to the clipboard.'); return true; }
  catch (e) {
    const ta = el('textarea', { style: 'position:fixed;left:-9999px;top:0' });
    ta.value = text; document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    toast(ok ? (okMsg || 'Copied to the clipboard.') : 'Copying is blocked here: select the text and copy it yourself.', ok ? undefined : 'err');
    return ok;
  }
}
function promptBox(title, text, value, unit) {
  return new Promise((resolve) => {
    let done = false;
    const inp = el('input', { class: 'num', type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': title });
    inp.value = value;
    const err = el('p', { class: 'modify-err', hidden: true });
    const finish = (v) => { if (done) return; done = true; app.dlgClose = null; $('dlg').hidden = true; resolve(v); };
    const ok = () => {
      const v = evalExpr(inp.value);
      if (v === null || !(v > 0)) { err.textContent = 'Type a length above zero, for example 120 or 4.5in.'; err.hidden = false; return; }
      finish(v);
    };
    inp.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); ok(); } else if (e.key === 'Escape') { e.preventDefault(); finish(null); } });
    showDialog({
      title, small: true,
      body: [el('p', { text }), el('div', { style: 'display:flex;gap:8px;align-items:center' }, inp, el('span', { class: 'unit', text: unit || '' })), err],
      foot: [el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => finish(null) }), el('button', { class: 'btn primary', type: 'button', text: 'Apply', onclick: ok })],
      onClose: () => finish(null),
    });
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  });
}
const extLink = (href, text, icon) => el('a', { href, target: '_blank', rel: 'noopener' }, icon ? svgUse(icon) : null, text);

      el('button', { class: 'btn', type: 'button', onclick: () => { if (text) copyText(text, 'TikZ code copied.'); } }, 'Copy'),
      el('button', { class: 'btn primary', type: 'button', onclick: () => { if (text) offerFile(base + '.tex', text, 'application/x-tex'); } }, svgUse('i-export'), 'Download .tex')],
  });
}

/* ---- Croquis UI: start (runs after every part is defined) ---- */
init();

})();

</script>
