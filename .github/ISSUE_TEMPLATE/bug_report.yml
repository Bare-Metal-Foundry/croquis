name: Bug report
description: Something does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Draw a rectangle
        2. Add a fillet of 5 mm on one corner
        3. …
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Sketch file or share link
      description: If you can, attach the sketch (File › Export sketch .json) or paste a View-only share link. They contain only the drawing.
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: "Chrome 141 on macOS 15"
    validations:
      required: true
